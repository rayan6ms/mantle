[package]
name = "mantle-reference"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jni = { version = "0.22.4", features = ["invocation"] }
ristretto_classfile = "0.32.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = { version = "0.11.0", default-features = false }
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
