[workspace]
members = [
    "crates/mantle-core",
    "crates/mantle-jvm",
    "crates/mantle-media",
    "crates/mantle-xaac",
    "tools/audio-layout-bench",
    "tools/jvm-gate",
    "tools/media-bench",
    "tools/oracle",
    "tools/reference",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
log = { version = "=0.4.33", features = ["max_level_debug"] }
symphonia = { version = "=0.6.0", default-features = false, features = ["aac", "isomp4", "mkv", "mp3", "pcm", "wav"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
