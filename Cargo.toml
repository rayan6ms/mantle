[workspace]
members = [
    "crates/mantle-core",
    "crates/mantle-jvm",
    "tools/jvm-gate",
    "tools/oracle",
    "tools/reference",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
