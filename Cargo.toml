[workspace]
members = [
    "crates/mantle-audio",
    "crates/mantle-core",
    "crates/mantle-jvm",
    "crates/mantle-media",
    "crates/mantle-opus",
    "crates/mantle-xaac",
    "tools/audio-layout-bench",
    "tools/jvm-gate",
    "tools/media-bench",
    "tools/worker-bench",
    "tools/oracle",
    "tools/reference",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
aes = { version = "=0.9.2", default-features = false }
cbc = { version = "=0.2.1", default-features = false, features = ["block-padding"] }
form_urlencoded = "=1.2.2"
log = { version = "=0.4.33", features = ["max_level_debug"] }
md-5 = { version = "=0.11.0", default-features = false }
opus-head-sys = { version = "=0.3.1", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }
rtrb = { version = "=0.3.5", default-features = false }
rubato = { version = "=5.0.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = { version = "=0.6.5", default-features = false }
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
