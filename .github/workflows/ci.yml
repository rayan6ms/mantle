name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-no-jvm-source.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: scripts/generate-reference-contract.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  supply-chain:
    name: Supply-chain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-vet@0.10.2
      - run: cargo audit --deny warnings
      - run: cargo deny check
      - run: cargo vet --locked

  jvm-gate-a:
    name: Gate A (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [11, 25, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: Swatinem/rust-cache@v2
      - name: Fetch frozen Lavaplayer API
        shell: bash
        run: |
          mkdir -p .cache/reference/lavaplayer-2.2.6
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/dev/arbjerg/lavaplayer/2.2.6/lavaplayer-2.2.6.jar \
            --output .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.jar
          expected='84aba896d988e12ea24c25f87f2e88eca4be7adac31893eacabf93401da1282d'
          actual=$(sha256sum .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.jar | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            printf 'Lavaplayer JAR SHA-256 mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
      - shell: bash
        run: scripts/run-jvm-gate-a.sh

  revapi-gate-a:
    name: Gate A independent API analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@v2
      - name: Fetch frozen API and supplementary dependencies
        run: |
          mkdir -p .cache/reference/lavaplayer-2.2.6/dependencies
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/dev/arbjerg/lavaplayer/2.2.6/lavaplayer-2.2.6.jar \
            --output .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.jar
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/dev/arbjerg/lavaplayer/2.2.6/lavaplayer-2.2.6.pom \
            --output .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.pom
          mvn -q -f .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.pom \
            dependency:copy-dependencies -DincludeScope=runtime \
            -DoutputDirectory="$PWD/.cache/reference/lavaplayer-2.2.6/dependencies"
      - name: Fetch pinned Revapi CLI
        run: |
          curl --fail --location --silent --show-error \
            https://repo1.maven.org/maven2/org/revapi/revapi-standalone/0.12.1/revapi-standalone-0.12.1-standalone.zip \
            --output .cache/revapi.zip
          expected='3b9dc5949e74da76f558dfa8012b8b7dc3a4124c0b4788eadee253d932111afb'
          actual=$(sha256sum .cache/revapi.zip | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            printf 'Revapi archive SHA-256 mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          unzip -q .cache/revapi.zip -d .cache
      - name: Compare the Gate A API slice
        run: |
          cargo run --locked -q -p mantle-jvm-gate -- emit \
            --reference-jar .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.jar \
            --output target/gate-a/mantle-gate-a.jar --expected-abi 1
          cargo run --locked -q -p mantle-jvm-gate -- emit-reference-slice \
            --reference-jar .cache/reference/lavaplayer-2.2.6/lavaplayer-2.2.6.jar \
            --output target/gate-a/lavaplayer-gate-a-reference.jar
          supplementary=$(find .cache/reference/lavaplayer-2.2.6/dependencies \
            -type f -name '*.jar' -printf '%p,' | sed 's/,$//')
          .cache/revapi-0.12.1/revapi.sh \
            -e org.revapi:revapi-java:0.28.4 \
            -o target/gate-a/lavaplayer-gate-a-reference.jar \
            -n target/gate-a/mantle-gate-a.jar \
            -s "$supplementary" -t "$supplementary"

  differential-oracle:
    name: Phase 3 deterministic differential oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11
      - uses: Swatinem/rust-cache@v2
      - name: Fetch frozen API and runtime dependencies
        shell: bash
        run: |
          reference=.cache/reference/lavaplayer-2.2.6
          mkdir -p "$reference/dependencies"
          for artifact in lavaplayer-2.2.6.jar lavaplayer-2.2.6.pom; do
            curl --fail --location --silent --show-error \
              "https://repo1.maven.org/maven2/dev/arbjerg/lavaplayer/2.2.6/$artifact" \
              --output "$reference/$artifact"
            expected=$(jq -r --arg file "$artifact" \
              '.published_artifacts[] | select(.file == $file) | .sha256' \
              reference/lavaplayer-2.2.6.lock.json)
            actual=$(sha256sum "$reference/$artifact" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              printf '%s SHA-256 mismatch: expected %s, got %s\n' "$artifact" "$expected" "$actual" >&2
              exit 1
            fi
          done
          mvn -q -f "$reference/lavaplayer-2.2.6.pom" dependency:copy-dependencies \
            -DincludeScope=runtime -DoutputDirectory="$PWD/$reference/dependencies"
          while IFS=$'\t' read -r artifact expected; do
            actual=$(sha256sum "$reference/dependencies/$artifact" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              printf '%s SHA-256 mismatch: expected %s, got %s\n' "$artifact" "$expected" "$actual" >&2
              exit 1
            fi
          done < <(jq -r '.resolved_runtime_artifacts[] | [.file, .sha256] | @tsv' \
            reference/lavaplayer-2.2.6.lock.json)
      - run: scripts/run-differential-oracle.sh
